name: Euronext
kind: company
description: Euronext N.V. is the leading pan-European exchange operator, running
  regulated cash and derivatives markets in Amsterdam, Brussels, Dublin, Lisbon, Milan,
  Oslo, and Paris, and owning Borsa Italiana and power exchange Nord Pool. Its market
  data arm sells real-time, delayed, historical, index, and reference data through
  the low-latency Optiq Market Data Gateway (UDP multicast SBE feed, also cloud-delivered),
  Optiq flat files, and the Euronext Web Services JSON API, alongside the Saturn REST
  API for MiFID II regulatory reporting. All access is sales-gated and entitlement-managed
  - client specifications are published as public PDFs but base URLs and tokens are
  issued only at onboarding, with no self-serve developer portal.
