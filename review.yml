aid: euronext
name: Euronext
review:
  question: Does Euronext expose a public, self-serve developer API for market data?
  answer: false
  date: '2026-07-21'
  reviewer: API Evangelist
  openapiHarvested: false
  openapiScopeNote: |
    No machine-readable OpenAPI, Swagger, or AsyncAPI document is publicly
    published for any Euronext API. All API documentation is distributed as
    PDF client specifications on euronext.com and the Euronext Connect
    portal (connect.euronext.com / connect2.euronext.com). The verified
    GitHub organization (github.com/euronext) contains only forks of
    infrastructure libraries (simple-binary-encoding, librdkafka, tcpflow,
    simplx, libxslt, PcapPlusPlus) and no API definitions, so nothing was
    harvested into openapi/.
findings:
  summary: |
    Euronext is an exchange data arm with a classically sales-gated,
    entitlement-managed market data posture. There is no developer portal
    (developer.euronext.com, docs.euronext.com, and api.euronext.com do not
    resolve - DNS failure on probe) and no self-serve signup, free tier, or
    public pricing page for data. The real, documented API surface is:
    (1) Euronext Web Services - a commercial JSON-over-HTTPS API for
    real-time, delayed, historical (EOD summary), reference, and index
    data, POST-only, authenticated with a user token, where the endpoint
    URL and key are issued to the client only at onboarding, so no public
    base URL exists; (2) the Saturn REST API for MiFID II regulatory
    reporting (JSON/XML/CSV, HTTPS logon returning an Authorization-header
    token, accounts via market-access@euronext.com); and (3) the Optiq
    Market Data Gateway, a UDP multicast SBE feed (LZ4-compressed
    snapshots, MDG Lite and cloud variants) that is not HTTP at all.
    Optiq flat-file specifications document additional file-based
    delivery. Client specifications are genuinely public PDFs, which is
    more transparent than many exchange data arms, but every live
    endpoint sits behind a market data agreement or membership. Contacts
    are webservices@euronext.com and databyeuronext@euronext.com.
  posture: sales-gated
  authentication:
    - api: Euronext Web Services
      model: User token issued at integration onboarding; POST-only JSON over HTTPS
    - api: Saturn Reporting API
      model: HTTPS logon with encrypted credentials returning a session token passed in the Authorization HTTP header
    - api: Optiq MDG
      model: Entitlement-managed market data agreement plus network connectivity provisioning (no HTTP auth)
  transports:
    - protocol: REST
      scheme: https
      note: Euronext Web Services (JSON, POST-only) and Saturn reporting web services (JSON/XML/CSV). No public base URL documented for either; URLs issued to clients.
      documented: true
    - protocol: UDP multicast (SBE)
      scheme: udp
      note: Optiq Market Data Gateway real-time and snapshot feeds, Simple Binary Encoding with LZ4 block compression; MDG Lite and cloud delivery variants.
      documented: true
    - protocol: Flat files
      scheme: https
      note: Optiq file-based delivery documented in the public Optiq File Specifications PDFs.
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No public WebSocket API is documented.
