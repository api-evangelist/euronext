      note: Verified org (euronext.com), six infrastructure forks, no API specs
  ownership: |
    Euronext N.V. is an independent, publicly listed company (ticker ENX on
    Euronext Paris) - it is the parent, not an acquired data arm. It
    operates exchanges in Amsterdam, Brussels, Dublin, Lisbon, Milan, Oslo,
    and Paris, and acquired Borsa Italiana (2021, from LSEG), Nord Pool,
    and Company Webcast among others.
sources:
  - url: https://www.euronext.com/en/data/how-access-market-data/web-services
    type: Documentation
    note: Euronext Web Services product page - HTTP/JSON REST, tailored commercial offer, contact-form onboarding.
  - url: https://www.euronext.com/en/data/real-time-data/how-access-market-data
    type: Documentation
    note: Lists all access channels - Optiq MDG, Web Services, vendors, brokers, ASP/ESP.
  - url: https://connect2.euronext.com/sites/default/files/documentation/data/ews_api_-_historical_data_client_specification.pdf
    type: APIReference
    note: EWS Historical Data (EOD Summary) client specification v1.0 - JSON, POST-only, token issued at onboarding, fields for indices and cash markets.
  - url: https://www.euronext.com/sites/www.euronext.com/files/euronext-saturn-web_services_specifications_2.8.8.pdf
    type: APIReference
    note: Saturn REST web services specification - JSON/XML/CSV, token in Authorization header, SubmitTrades NEW/AMEND/CANCEL.
  - url: https://connect.euronext.com/en/it-documentation
    type: Documentation
    note: Euronext Connect IT documentation index hosting Optiq MDG, Optiq Files, OEG, and Saturn specification PDFs.
actions:
  openapiPath: null
  apisYmlUpdated: true
  reason: |
    Five real documented API/feed products were cataloged in apis.yml
    (Web Services market data, historical, indices; Saturn reporting;
    Optiq MDG). No baseURL fields were recorded because Euronext does not
    publicly document any endpoint hostname - URLs and tokens are issued
    per client. No OpenAPI was harvested because none is published;
    fabricating one from the PDFs was out of scope for bootstrap.
